<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Calc</title><style>body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}.calc{background:#fff;padding:20px;border-radius:24px;width:300px;box-shadow:0 10px 30px rgba(0,0,0,.2);border-top:8px solid #E30613}.logo{text-align:center;font-weight:900;letter-spacing:2px;margin-bottom:10px}.logo span{color:#E30613}#d{width:100%;height:60px;font-size:32px;text-align:right;border-radius:12px;border:2px solid #000;background:#111;color:#fff;padding:10px;box-sizing:border-box;margin-bottom:12px}button{width:62px;height:62px;margin:5px;font-size:20px;border-radius:50%;border:none;font-weight:700}.num{background:#000;color:#fff}.op{background:#E30613;color:#fff}.clear{background:#fff;color:#E30613;border:2px solid #E30613}.eq{background:#000;color:#fff;width:134px;border-radius:30px}</style></head><body><div class="calc"><div class="logo">RIVER <span>PLATE</span></div><input id="d" disabled><div><button class="num" onclick="a('7')">7</button><button class="num" onclick="a('8')">8</button><button class="num" onclick="a('9')">9</button><button class="op" onclick="a('/')">÷</button><button class="num" onclick="a('4')">4</button><button class="num" onclick="a('5')">5</button><button class="num" onclick="a('6')">6</button><button class="op" onclick="a('*')">×</button><button class="num" onclick="a('1')">1</button><button class="num" onclick="a('2')">2</button><button class="num" onclick="a('3')">3</button><button class="op" onclick="a('-')">-</button><button class="clear" onclick="c()">C</button><button class="num" onclick="a('0')">0</button><button class="num" onclick="a('.')">.</button><button class="op" onclick="a('+')">+</button><button class="eq" onclick="e()">=</button><button class="clear" onclick="b()">⌫</button></div></div><script>let D=document.getElementById('d');function a(v){D.value+=v}function c(){D.value=''}function b(){D.value=D.value.slice(0,-1)}function e(){try{D.value=eval(D.value)}catch{D.value='Error'}}</script></body></html>
